name: Release

on:
  workflow_run:
    workflows: ['Test']
    branches: [master]
    types: [completed]

jobs:
  deploy:
    name: Conditionally Release and Deploy # depends on the content of CHANGELOG.md
    runs-on: ubuntu-latest
    environment: Release
    if: github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/master' && github.repository_owner == 'matepek'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false # to drop github token and used GITHUBM_API_KEY

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.x'

      - name: Install
        run: npm install

      - name: Audit
        env:
          NODE_ENV: production
        run: npm audit

      - name: Compile
        run: npm run compile

      - name: Deploy
        run: npm run deploy
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          GITHUBM_API_KEY: ${{ secrets.GITHUBM_API_KEY }}
