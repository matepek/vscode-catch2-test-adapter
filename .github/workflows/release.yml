name: Release

on:
  workflow_run:
    workflows: ['Test']
    branches: [master]
    types: [completed]

jobs:
  deploy:
    name: Conditionally Release and Deploy # depends on the content of CHANGELOG.md
    runs-on: ubuntu-latest
    environment: Release
    if: github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/master' && github.repository_owner == 'matepek'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # to drop github token and used GITHUBM_API_KEY

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'

      - name: Install
        run: npm install

      - name: Audit
        env:
          NODE_ENV: production
        run: npm audit

      - name: Compile
        run: npm run compile

      - name: Deploy
        run: npm run deploy
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          GITHUBM_API_KEY: ${{ secrets.GITHUBM_API_KEY }}
