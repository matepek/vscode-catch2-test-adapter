name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-linux:
    name: Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        VSCODE_VERSION:
          - stable
          # - minimum <-- disabled because no relevant test running now
        experimental: [false]
        # include: <-- disabled because no relevant test running now
        #   - VSCODE_VERSION: 'insiders'
        #     experimental: true
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install
        run: npm install

      - name: Compile
        run: npm run compile

      - name: Webpack # test does not use it, but we are testing the webpack creation
        run: |
          npm run webpack
          ls -all out/dist

      - name: ESLint
        run: npm run eslint

      - name: Test
        run: |
          /usr/bin/Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 3
          npm test
        env:
          DISPLAY: ':99.0'

  test-windows:
    name: Windows
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        VSCODE_VERSION:
          - stable
          # - minimum <-- disabled because no relevant test running now
        experimental: [false]
        # include: <-- disabled because no relevant test running now
        #   - VSCODE_VERSION: 'insiders'
        #     experimental: true
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install
        run: npm install

      - name: Compile
        run: npm run compile

      # - name: ESLint
      #   run: npm run eslint

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Test
        run: npm test

  test-mac:
    name: MacOS
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        VSCODE_VERSION:
          - stable
          # - minimum <-- disabled because no relevant test running now
        experimental: [false]
        # include: <-- disabled because no relevant test running now
        #   - VSCODE_VERSION: 'insiders'
        #     experimental: true
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install
        run: npm install

      - name: Compile
        run: npm run compile

      # - name: ESLint
      #   run: npm run eslint

      - name: Test
        run: npm test
